name: gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The coverage and dependency steps diff against git merge-base origin/main HEAD.
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      # The app module builds against the Android SDK that ubuntu-latest preinstalls, with its
      # licenses already accepted. The Android Gradle plugin finds it through $ANDROID_HOME and
      # downloads any missing platform or build tools itself. Nothing here accepts a license.
      - name: Show the Android SDK
        run: |
          test -n "$ANDROID_HOME" || { echo "ANDROID_HOME is not set on this runner" >&2; exit 1; }
          echo "ANDROID_HOME=$ANDROID_HOME"

      - name: Run the gate
        env:
          # A pull request checks out a detached merge commit, so name the head branch for the
          # ticket-id lookup (SPA-### in the branch name). On a push to main this is "main".
          GATE_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: pipeline/gate/run.sh

      - name: Upload the verdict
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gate-verdict
          path: gate-verdict.json
          if-no-files-found: error

      # When a snapshot differs, the actual and compare images show how.
      - name: Upload snapshot differences
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: snapshot-differences
          path: app/build/outputs/roborazzi/
          if-no-files-found: ignore
